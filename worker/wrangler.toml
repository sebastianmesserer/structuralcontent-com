name = "sc-cascade"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Inline prompts/system-prompt.md (core IP, gitignored) into the Worker bundle as a
# Text module — the prompt exceeds the 5.1 kB Worker-secret limit, so it can't be a
# secret. `import SYSTEM_PROMPT from "../prompts/system-prompt.md"` in src/index.ts.
rules = [
  { type = "Text", globs = ["**/*.md"], fallthrough = true }
]

[vars]
# Quality default. Cheaper/faster alternative: "claude-sonnet-4-6" (one-line switch, redeploy).
MODEL = "claude-opus-4-8"

# Secrets (set once via wrangler, never in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put SYSTEM_PROMPT < prompts/system-prompt.md

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Consented research storage. Local dev simulates KV; namespace created via
#   npx wrangler kv namespace create RESEARCH
[[kv_namespaces]]
binding = "RESEARCH"
id = "51d2d51ecda74abca4f9fcac487eaced"

# Per-IP usage cap counter (10 runs / 30-day window). Created via
#   npx wrangler kv namespace create USAGE
[[kv_namespaces]]
binding = "USAGE"
id = "b9ccec2acc204fb7bea66075636a6bbf"
