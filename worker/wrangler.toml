name = "sc-cascade"
main = "src/index.ts"
# The Cloudflare account that owns sc-cascade and the RESEARCH/USAGE KV namespaces.
# Pinned so a wrangler login that resolves to a different account fails loudly instead
# of silently deploying a second, parallel worker.
account_id = "86d8cfd4499299c91a61fa2a9142a683"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Inline prompts/*.md (core IP, gitignored) into the Worker bundle as a
# Text module — the prompt exceeds the 5.1 kB Worker-secret limit, so it can't be a
# secret. See the `import … from "../prompts/*.md"` lines in src/index.ts.
rules = [
  { type = "Text", globs = ["**/*.md"], fallthrough = true }
]

[vars]
# Claude on Amazon Bedrock (InvokeModel), so runs are paid from AWS, not Anthropic API
# spend. `global.` = global cross-region inference profile (best availability, no regional
# premium; no EU pinning needed). Opus 4.6 is the newest model with structured outputs on
# Bedrock (the newer Messages-API endpoint rejects `output_config.format`, tested 3 Oct
# 2026) — keep it until that endpoint supports them. AWS_REGION is the source region.
MODEL = "global.anthropic.claude-opus-4-6-v1"
AWS_REGION = "eu-west-1"

# Secrets (set once via wrangler, never in this file):
#   npx wrangler secret put AWS_ACCESS_KEY_ID        # dedicated IAM user, invoke-one-model policy only
#   npx wrangler secret put AWS_SECRET_ACCESS_KEY
#   npx wrangler secret put EXEMPT_IPS        # optional: comma-separated IPs exempt from the demo limits

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Consented research storage. Local dev simulates KV; namespace created via
#   npx wrangler kv namespace create RESEARCH
[[kv_namespaces]]
binding = "RESEARCH"
id = "51d2d51ecda74abca4f9fcac487eaced"

# Per-IP usage cap counter (10 runs / 30-day window). Created via
#   npx wrangler kv namespace create USAGE
[[kv_namespaces]]
binding = "USAGE"
id = "b9ccec2acc204fb7bea66075636a6bbf"
